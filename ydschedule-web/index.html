<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="极简日程表 YDSchedule —— 极度专注、高自由度的个人时间管理工具（Web 原型）">
<meta name="theme-color" content="#F3F0E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="YDSchedule">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>极简日程表 · YDSchedule</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-view="home" data-theme="paper">

  <!-- 左侧导航：收起态窄条（时间刻度 + 今日日程标点 + 当前时间指示） -->
  <aside class="nav-rail" id="navRail" aria-label="时间刻度导航">
    <div class="rail-ticks" id="railTicks"></div>
    <div class="rail-marks" id="railMarks" aria-hidden="true"></div>
    <div class="rail-now" id="railNow" aria-hidden="true"></div>
  </aside>

  <!-- 左侧导航：展开态面板 -->
  <aside class="nav-panel" id="navPanel" aria-label="主导航">
    <nav class="nav-list">
      <a class="nav-item" data-nav="home" data-i18n="nav.home" tabindex="0">首页</a>
      <a class="nav-item" data-nav="today" data-i18n="nav.today" tabindex="0">今日日程</a>
      <a class="nav-item" data-nav="week" data-i18n="nav.week" tabindex="0">周日程</a>
      <a class="nav-item" data-nav="month" data-i18n="nav.month" tabindex="0">月日程</a>
      <a class="nav-item" data-nav="plugins" data-i18n="nav.plugins" tabindex="0">插件视图</a>
      <div class="nav-custom" id="navCustom"></div>
    </nav>
  </aside>

  <!-- 主工作区 -->
  <main class="app-main" id="appMain">
    <section class="view" id="view-home"></section>
    <section class="view" id="view-today"></section>
    <section class="view" id="view-week"></section>
    <section class="view" id="view-month"></section>
    <section class="view" id="view-plugins"></section>
    <section class="view" id="view-custom"></section>
  </main>

  <!-- 设置入口（左下角齿轮） -->
  <button class="settings-btn" id="settingsBtn" aria-label="设置" title="">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    <span class="settings-tip" data-i18n="settings.title">设置</span>
  </button>

  <!-- 设置弹窗 -->
  <div class="modal-mask" id="settingsMask" hidden>
    <div class="settings-panel" id="settingsPanel" role="dialog" aria-modal="true" aria-label="设置">
      <div class="settings-head">
        <span class="settings-title" data-i18n="settings.title">设置</span>
        <button class="settings-close" id="settingsClose" aria-label="关闭设置">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="settings-body">
        <div class="settings-cats" id="settingsCats"></div>
        <div class="settings-content" id="settingsContent"></div>
      </div>
    </div>
  </div>

  <!-- 快捷设置日程弹窗 -->
  <div class="modal-mask" id="quickMask" hidden>
    <div class="quick-panel" id="quickPanel" role="dialog" aria-modal="true" aria-label="快捷设置日程">
      <div class="settings-head">
        <span class="settings-title" data-i18n="quick.title">快捷设置日程</span>
        <button class="settings-close" id="quickClose" aria-label="关闭快捷设置">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="quick-body" id="quickBody">
        <input class="quick-title" id="quickTitle" placeholder="日程标题，如：去晾衣服" maxlength="30" autocomplete="off" />
        <div class="quick-label" data-i18n="quick.date">日期</div>
        <div class="quick-opts" id="quickDate"></div>
        <div class="quick-label" data-i18n="quick.period">时段</div>
        <div class="quick-opts" id="quickPeriod"></div>
        <div class="quick-label" data-i18n="quick.time">时间</div>
        <div class="quick-opts" id="quickHour"></div>
        <div class="quick-label" data-i18n="quick.minute">分钟</div>
        <div class="quick-opts" id="quickMin"></div>
        <div class="quick-label" data-i18n="quick.tag">标签</div>
        <div class="quick-opts" id="quickTag"></div>
        <button class="quick-confirm" id="quickConfirm" data-i18n="quick.confirm">添加到日程</button>
      </div>
    </div>
  </div>

  <!-- 全局轻提示 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="parser.js"></script>
  <script src="api.js"></script>
  <script src="locales.js"></script>
  <script src="plugin-design.js"></script>
  <script src="app.js"></script>
  <script>
    /* PWA 离线缓存注册：仅在 http/https 环境启用（Electron file:// 下自动跳过） */
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
